[project]
name = "listens-etl"
version = "0.1.0"
description = "ETL pipeline and analytics for ListenBrainz listening history, backed by DuckDB."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "duckdb>=1.1",
]

[project.scripts]
listens-etl = "listens_etl.cli:main"

[dependency-groups]
dev = [
    "pre-commit>=4.0",
    "pytest>=8.3",
    "ruff>=0.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/listens_etl"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "UP",  # pyupgrade
    "SIM", # flake8-simplify
    "PTH", # prefer pathlib
]
