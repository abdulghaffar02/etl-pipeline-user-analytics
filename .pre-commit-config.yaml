repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: no-commit-to-branch
        args: [--branch, main]
      - id: check-added-large-files
        args: [--maxkb=1024]
      - id: check-merge-conflict
      - id: check-toml
      - id: check-yaml
      - id: end-of-file-fixer
      - id: trailing-whitespace

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.9
    hooks:
      - id: ruff-check
        args: [--fix]
      - id: ruff-format

  # Keep pip-installable lock files in sync with uv.lock (used by the pip fallback in README).
  - repo: https://github.com/astral-sh/uv-pre-commit
    rev: 0.12.19
    hooks:
      - id: uv-export
        name: uv-export (requirements.txt)
        args: [--frozen, --no-dev, --no-emit-project, --quiet, --output-file=requirements.txt]
      - id: uv-export
        name: uv-export (requirements-dev.txt)
        args: [--frozen, --no-emit-project, --quiet, --output-file=requirements-dev.txt]
